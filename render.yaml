services:
  - type: web
    name: daily-report-live
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: GITHUB_TOKEN
        sync: false
